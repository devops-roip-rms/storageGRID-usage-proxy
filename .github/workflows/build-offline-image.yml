name: Test and Build Offline Docker Image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: storagegrid-usage-proxy

jobs:
  test-python36:
    name: Test on Python 3.6
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Pull Python 3.6 image with retry
        shell: bash
        run: bash .github/scripts/pull-image-with-retry.sh "python:3.6.15-slim-buster"

      - name: Run test suite on Python 3.6.15
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.6.15-slim-buster \
            python3 -m unittest discover -s tests -v

  test-python311:
    name: Test on Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run test suite on Python 3.11
        run: |
          python3 --version
          python3 -m unittest discover -s tests -v

  release-check:
    name: Decide whether to package image
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      should_package: ${{ steps.decision.outputs.should_package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release trigger
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/release-check.sh

  package-docker-offline:
    name: Build offline Docker image artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - test-python36
      - test-python311
      - release-check

    if: needs.release-check.outputs.should_package == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine image version
        id: version
        shell: bash
        run: bash .github/scripts/determine-version.sh

      - name: Verify Docker
        run: docker version

      - name: Pull Docker base image with retry
        shell: bash
        run: bash .github/scripts/pull-image-with-retry.sh "python:3.11-slim-bookworm"

      - name: Build versioned image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/build-image.sh

      - name: Export offline Docker archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAR_FILE: ${{ steps.version.outputs.tar_file }}
        run: bash .github/scripts/export-offline-image.sh

      - name: Upload offline image artifact
        uses: actions/upload-artifact@v7
        with:
          name: storagegrid-usage-proxy-${{ steps.version.outputs.version }}
          path: |
            storagegrid-usage-proxy_*.tar
            storagegrid-usage-proxy_*.tar.sha256
            IMAGE_VERSION.txt
            .env
            compose.yml
          if-no-files-found: error
          retention-days: 30
          compression-level: 0